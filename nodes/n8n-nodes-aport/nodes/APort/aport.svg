<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: rgb(15, 23, 42); stop-opacity: 1;"/>
      <stop offset="100%" style="stop-color: rgb(30, 41, 59); stop-opacity: 1;"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: rgb(6, 182, 212); stop-opacity: 1;"/>
      <stop offset="100%" style="stop-color: rgb(8, 145, 178); stop-opacity: 1;"/>
    </linearGradient>
    <linearGradient id="subtleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: rgb(248, 250, 252); stop-opacity: 1;"/>
      <stop offset="100%" style="stop-color: rgb(226, 232, 240); stop-opacity: 0.8;"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#subtleGradient)" stroke="url(#primaryGradient)" stroke-width="1.5"/>
  <g transform="translate(60, 60)">
