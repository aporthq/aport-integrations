[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aport-crewai-decorator-example"
version = "0.1.0"
description = "CrewAI task verification decorator example for APort"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
]

[project.optional-dependencies]
crewai = [
  "crewai>=0.80.0",
]
sdk = [
  "aporthq-sdk-python>=0.1.0",
]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
