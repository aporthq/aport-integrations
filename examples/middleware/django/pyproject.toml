[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aport-middleware-django"
version = "0.1.0"
description = "Django middleware and decorators for APort agent policy verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "APort Team", email = "team@aport.io" }]
keywords = ["aport", "django", "middleware", "agent", "verification", "policy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Security",
]
dependencies = [
  "Django>=4.2,<6.0",
  "aporthq-sdk-python>=0.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/aporthq/aport-integrations"
Issues = "https://github.com/aporthq/aport-integrations/issues"
Documentation = "https://github.com/aporthq/aport-integrations/tree/main/examples/middleware/django"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
